h{font-size:10px;color:var(--muted);text-align:center}th.rowlabel{min-width:300px;max-width:300px;position:sticky;left:0;background:var(--surface);z-index:2;text-align:left}tbody th{font-size:12px;padding:0;height:16px;line-height:16px}tbody td{padding:0;height:16px;line-height:0}thead .group{border-bottom:1px solid var(--line);font-size:12px;padding-bottom:4px}.topic{border:0;padding:0;background:none;font-weight:600;font-size:12px;line-height:16px;height:16px;text-align:left;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}.feature{display:block;padding-left:16px;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.boundary{border-left:8px solid var(--surface)}#tooltip{position:fixed;max-width:min(360px,calc(100vw - 16px));z-index:10;background:var(--ink);color:var(--surface);padding:10px;border-radius:5px;white-space:pre-line;pointer-events:none;font-size:12px}#panel{position:fixed;right:0;top:0;height:100dvh;width:min(480px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-10px 0 40px #0003;padding:20px;overflow:auto;z-index:20}#panel h2{font-size:19px;padding-right:65px}#panel h3{font-size:14px}#panel pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--empty);padding:8px;font:12px monospace}#panel a{overflow-wrap:anywhere}#panel li{margin:6px 0}#close{float:right}#texttable td{line-height:1.4;padding:5px;border-bottom:1px solid var(--line);min-width:95px}#texttable th{max-width:280px}small{color:var(--muted)}[hidden]{display:none!important}@media(max-width:600px){body{padding:16px 12px}h1{font-size:22px}#filters{gap:8px}th.rowlabel{min-width:210px;max-width:210px}.feature{max-width:210px}#summary{gap:9px;font-size:12px}}
.view-scroll{max-width:100%;overflow:auto;border:1px solid var(--line);border-radius:5px;width:fit-content}.view-table{border-spacing:2px}.view-table th,.view-table td{vertical-align:middle}.view-table thead th{padding:2px 5px}.view-table tbody th{white-space:nowrap;max-width:300px;overflow:hidden;text-overflow:ellipsis}.view-table tbody td{text-align:center;padding:0 2px}.view-table small{display:block;color:var(--muted)}.comparison-table .topic small{display:inline}.comparison-table tbody th{width:300px;max-width:300px}.main-table{min-width:720px}.main-table th:first-child{min-width:170px;text-align:left}.main-table td{min-width:24px}.view-table h2{font-size:18px}select{max-width:100%}label{max-width:100%}#view{min-width:0}@media(max-width:600px){#filters label{flex-wrap:wrap}#view{max-width:320px}}
</style>
<h1>BMAS Gauge Blocks: CAD</h1><p>Open DWG and DXF interchange test files</p>
<div id="filters"><label>View <select id="view"><option value="main" selected>Standard and programs</option><option value="comparison">Program A to program B</option><option value="detailed">Detailed coverage and compatibility</option></select></label><label id="mode-label">Detail mode <select id="mode"><option value="coverage">Coverage</option><option value="compatibility">Compatibility</option></select></label><label id="writer-label">Writer <select id="writer"></select></label><label id="resaver-label">Resaver <select id="resaver"></select></label><label>Program pair <select id="pair"><option value="all">All pairs</option></select></label><label>Format <select id="format"><option value="all">All formats</option><option>DWG</option><option>DXF</option></select></label><label>Status <select id="status"></select></label><button id="tabletoggle" aria-pressed="false">Table view</button></div>
<div id="summary" aria-live="polite"></div><div id="legend"></div>
<p id="instructions" style="font-size:12px;margin-bottom:10px">Select a topic to expand. Hover or focus a square for its label; select it for evidence. ◥ Self-read: DWG read through its own converter.</p>
<div id="views"></div><div id="gridbox" tabindex="0" aria-label="Scrollable feature map"><table id="grid"></table><table id="texttable" hidden></table></div>
<p id="method" style="font-size:12px"></p><p id="builds" style="font-size:11px"></p>
<div id="tooltip" role="tooltip" hidden></div><aside id="panel" aria-label="Cell evidence" hidden><button id="close">Close ×</button><div id="details"></div></aside>
<script>
const DATA=/*DATA*/;
const icons={'source not readable':'×','lost in writer or converter':'≠','unreadable by reader':'×','reader_error':'×','not_scored':'·','kept':'✓','covered':'✓','changed':'≠','partial':'◐','lost':'−','refused':'×','not run':'·','no source':'−','not applicable':'/','planned':'□','wanted':'◇','blocked':'⚿','measured':'✓','native drawing':'✓','included':'✓','present':'✓','future':'◇','omitted':'·','not measured':'·','no native drawing':'·','not scored':'·','lost by converter':'≠'};
const sets={coverage:['covered','partial','planned','wanted','blocked','no source','not applicable'],compatibility:['source not readable','lost in writer or converter','unreadable by reader','reader_error','not_scored','kept','changed','lost','refused','not run','not applicable']};
const rank={'source not readable':1.2,'lost in writer or converter':1.5,'unreadable by reader':1.8,reader_error:1.7,'not applicable':-1,'no source':-0.5,not_scored:1,kept:0,covered:0,planned:2,wanted:3,'not run':1,partial:1,changed:2,lost:3,blocked:4,refused:4};
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function evidence(cell){
 const refs=typeof cell.evidence==='string'?(cell.evidence?cell.evidence.split(',').flatMap(span=>{const [a,b]=span.split(':').map(Number);return Array.from({length:(b??a)-a+1},(_,n)=>a+n)}):[]):cell.evidence;
 return refs.map(i=>{
  const row=typeof i==='number'?DATA.evidence_rows[i]:i;
  return Array.isArray(row)?{...DATA.evidence_contexts[row[0]],...(DATA.evidence_fields[row[1]]===null?{}:{field:DATA.evidence_fields[row[1]]}),status:row[2]}:row;
 });
}
let viewCells=[];
function display(s,coverage=false){return (coverage?DATA.coverage_display:DATA.display)[s]||s.replaceAll('_',' ')}
function detailDisplay(s){return display(s,$('mode').value==='coverage')}
function publicEvidence(value){
 if(Array.isArray(value))return value.map(publicEvidence);
 if(value && typeof value==='object')return Object.fromEntries(Object.entries(value).map(([k,v])=>[k.replaceAll('_',' '), typeof v==='string' && ['status','source_status','attribution'].includes(k)?display(v):publicEvidence(v)]));
 return value;
}
function square(s,attributes,self=false){return `<button class="cell ${s.replaceAll(' ','-')}${self?' self':''}" ${attributes}>${icons[s]}</button>`}
const palette={measured:'kept','native drawing':'kept',included:'kept',present:'kept',future:'wanted',omitted:'not run','not measured':'not run','no native drawing':'not run','not scored':'not_scored','lost by converter':'changed'};
const squareStatus=s=>palette[s]||s;
function viewButton(cell){
 const n=viewCells.push(cell)-1;
 const status=squareStatus(cell.status);
 return square(status,`data-evidence="${n}" aria-label="${esc(cell.label)}"`);
}
function topicButton(name,key,count){
 const open=expanded.has(key);
 return `<button class="topic" title="${esc(name)}" data-topic="${key}" aria-expanded="${open}">${open?'▾':'▸'} ${esc(name)} <small>(${count} feature${count===1?'':'s'})</small></button>`;
}
function renderViews(){
 viewCells=[]; $('instructions').textContent='Select a cell for the fields, files and statuses behind its label, then follow its link to detailed coverage and compatibility.'; $('views').hidden=false;$('gridbox').hidden=true;
 const comparison=$('view').value==='comparison';
 for(const id of ['pair','format','status','tabletoggle','mode'])$(id).closest('label')?$(id).closest('label').hidden=true:$(id).hidden=true;
 $('writer-label').hidden=$('resaver-label').hidden=!comparison;
 $('summary').innerHTML='';$('legend').innerHTML=['kept','changed','lost','refused','reader_error','not run','not_scored'].map(s=>`<span>${swatch(s)} ${s==='not run'?'not measured':display(s)}</span>`).join('');
 let html='<p><a href="#detailed">Detailed coverage and compatibility →</a></p>';
 if(!comparison){
 const data=DATA.main_view;
 $('legend').innerHTML+=['included','partial','present','future','omitted'].map(s=>`<span>${swatch(squareStatus(s))} Dataset: ${s}</span>`).join('');
 for(const group of data.groups){
 html+=`<h2>${esc({entity:'Entities',object:'Objects',table:'Symbol tables',header:'Header variables'}[group.kind])}</h2><div class="view-scroll" tabindex="0"><table class="view-table main-table"><thead><tr><th>Standard item</th><th>Dataset</th>${data.programs.map(p=>`<th colspan="3">${esc(p.name)}${p.shared_engine?'<small>ODA library</small>':''}</th>`).join('')}</tr><tr><th></th><th></th>${data.programs.map(()=>'<th>R</th><th>W</th><th>T</th>').join('')}</tr></thead><tbody>`;
 for(const row of group.rows)html+=`<tr><th><a href="${esc(row.reference_url)}">${esc(row.name)}</a></th><td>${viewButton(row.dataset)}</td>${data.programs.map(p=>['reads','writes','round_trip'].map(k=>`<td>${viewButton(row.programs[p.id][k])}</td>`).join('')).join('')}</tr>`;
 html+='</tbody></table></div>';
 }
 html+='<p>R: reads · W: writes natively · T: round trip</p>';
 $('method').textContent='Round trip counts distinct measured features across declared pairs. Fully kept requires every observed field and slot to be kept. Wholly unscored features are excluded. Select a cell for its evidence.';
 }else{
 const data=DATA.comparisons[$('writer').value+'__'+$('resaver').value];
 if(!data){html+='<p>? not measured: this pair is not declared.</p>'}else{
 const summary=data.summary;
 $('summary').textContent=`${summary.label}: ${summary.kept} kept, ${summary.changed} changed, ${summary.lost} lost, ${summary.refused} refused, ${summary.source_not_readable} source not readable, ${summary.writer_or_converter} writer or converter, ${summary.unreadable_by_reader} unreadable by reader, ${summary.not_measured} not measured`;
 html+='<div class="view-scroll" tabindex="0"><table class="view-table comparison-table"><thead><tr><th>Standard item / feature</th><th title="Round trip">Round trip</th><th title="Native reading path">Native read</th></tr></thead><tbody>';
 data.groups.forEach((group,gi)=>{
 const key='comparison:'+$('writer').value+'__'+$('resaver').value+':'+gi,open=expanded.has(key);
 html+=`<tr><th>${topicButton(group.name,key,group.rows.length)}</th>`;
 for(const column of ['round_trip','native_read']){
 const status=worst(group.rows.map(r=>squareStatus(r[column].status)));
 const cell=group.rows.find(r=>squareStatus(r[column].status)===status)[column];
 const columnName=column==='round_trip'?'Round trip':'Native reading path';
 html+=`<td>${viewButton({...cell,label:group.name+' / '+columnName+': '+cell.label})}</td>`;
 }
 html+='</tr>';
 if(open){
 for(const row of group.rows){const c=row.round_trip,notes=[row.intent_id,'Writer native drawing: '+(row.native?'yes':'no'),'Reader / converter: '+([...new Set(evidence(c).map(r=>(r.reader||'No reader recorded')+(r.converter?' / '+r.converter:'')))].join('; ')||'not measured')+(c.shared_engine?' · shared engine':'')];html+=`<tr><th><span class="feature" title="${esc(row.feature)}">${esc(row.feature)}</span></th><td>${viewButton({...c,notes})}</td><td>${viewButton({...row.native_read,notes})}</td></tr>`}
 }
 });
 html+='</tbody></table></div>';

 }
 $('method').textContent='Counts in each row describe measured format/version/encoding slots, including not scored slots. The summary counts features. Source provenance and the reading path determine attribution. Source not readable, writer or converter, and unreadable by reader have separate summary buckets. DXF read directly supplies headline fidelity counts.';
 }
 $('views').innerHTML=html;
}
function initializeViews(){
 const programs=DATA.main_view.programs;
 for(const id of ['writer','resaver'])for(const p of programs)$(id).add(new Option(p.name,p.id));
 function resavers(){const writer=$('writer').value,previous=$('resaver').value; $('resaver').innerHTML='';for(const pair of DATA.pairs){const [a,b]=pair.split('__');if(a===writer)$('resaver').add(new Option(programs.find(p=>p.id===b).name,b))}if([...$('resaver').options].some(o=>o.value===previous))$('resaver').value=previous;render()}
 $('writer').innerHTML='';for(const p of programs)if(DATA.pairs.some(pair=>pair.startsWith(p.id+'__')))$('writer').add(new Option(p.name,p.id));
 $('writer').onchange=()=>{$('panel').hidden=true;resavers()};$('resaver').onchange=()=>{$('panel').hidden=true;render()};resavers();
 document.addEventListener('click',e=>{if(e.target.closest('a[href^="#detailed"]')){e.preventDefault();history.replaceState(null,'',e.target.closest('a').getAttribute('href'));followDetail();return;}const b=e.target.closest('[data-evidence]');if(!b)return;lastCell=b;$('tooltip').hidden=true;const c=viewCells[+b.dataset.evidence];$('details').innerHTML=`<h2>${esc(icons[c.status])} ${esc(c.label)}</h2>${(c.notes||[]).map(note=>`<p>${esc(note)}</p>`).join('')}<p><a class="detail-link" href="${esc(c.detail_link)}">Detailed coverage and compatibility →</a></p><pre>${esc(JSON.stringify(publicEvidence(evidence(c)),null,2))}</pre>`;$('panel').hidden=false;$('close').focus()});
 window.addEventListener('hashchange',followDetail);followDetail();
}
let detailFilter=null;
function detailFeatures(topic){
 const item=detailFilter?.get('item');
 if(!item)return topic.features;
 const allowed=new Set(Object.values(DATA.comparisons).flatMap(c=>c.groups).filter(g=>g.name===item&&(!detailFilter.get('kind')||g.kind===detailFilter.get('kind'))).flatMap(g=>g.rows).filter(r=>r.intent_id===topic.id).map(r=>r.feature));
 return topic.features.filter(f=>allowed.has(f.name));
}
function followDetail(){
 if(!location.hash.startsWith('#detailed'))return;
 const q=new URLSearchParams(location.hash.split('?')[1]||'');detailFilter=q;
 $('view').value='detailed';$('mode').value=q.get('program')?'compatibility':'coverage';
 $('pair').value=q.get('pair')||'all';$('panel').hidden=true;

 resetStatus();render();
}

let expanded=new Set(),tableMode=false,lastCell;
function worst(states){return states.reduce((a,b)=>rank[b]>rank[a]?b:a,'not applicable')}
function runs(c){return c.runs.filter(r=>($('pair').value==='all'||r.pair===$('pair').value)&&(!detailFilter?.get('program')||detailFilter.get('pair')||r.pair.endsWith('__'+detailFilter.get('program'))||r.readers.some(reader=>reader.split(' ')[0]===detailFilter.get('program'))))}
function state(c){return $('mode').value==='coverage'?c.coverage:!c.applicable?'not applicable':worst(runs(c).map(r=>r.status).concat(runs(c).length?[]:['not run']))}
function aggregate(fs,k){
 const cs=fs.map(f=>f.cells[k]), grouped=new Map();
 for(const r of cs.flatMap(c=>c.runs)){
  const key=r.pair+'|'+r.output;
  if(!grouped.has(key))grouped.set(key,{...r,diffs:[],readers:[]});
  const g=grouped.get(key);g.status=worst([g.status,r.status]);
  g.self ||= r.self;g.readers=[...new Set([...g.readers,...r.readers])];
  for(const d of r.diffs)if(!g.diffs.some(x=>JSON.stringify(x)===JSON.stringify(d)))g.diffs.push(d);
 }
 return {coverage:worst(cs.map(c=>c.coverage)),applicable:cs.some(c=>c.applicable),runs:[...grouped.values()],missing:[...new Set(cs.flatMap(c=>c.missing||[]))],impossible:[...new Set(cs.flatMap(c=>c.impossible||[]))],files:[...new Set(cs.flatMap(c=>c.files))]};
}
function swatch(s,cls='swatch'){return `<span class="${cls} ${s.replaceAll(' ','-')}" aria-hidden="true">${icons[s]}</span>`}
function render(){
 if($('view').value!=='detailed'){renderViews();return} $('instructions').textContent='Select a topic to expand. Hover or focus a square for its label; select it for evidence. ◥ Shared engine: the recorded reader or converter shares the writer engine.'; $('views').hidden=true;$('gridbox').hidden=false; for(const id of ['pair','format','status','mode'])$(id).closest('label').hidden=false;$('tabletoggle').hidden=false;$('writer-label').hidden=$('resaver-label').hidden=true; const view=$('mode').value,states=sets[view],counts=Object.fromEntries(states.map(s=>[s,0]));
 const cols=DATA.columns.map((c,k)=>({c,k})).filter(({c})=>$('format').value==='all'||c[0]===$('format').value);
 $('pair').disabled=view==='coverage';
 let head='<thead><tr><th class="rowlabel" rowspan="3">Topic / feature</th>';
 for(const fmt of ['DWG','DXF']){let n=cols.filter(x=>x.c[0]===fmt).length;if(n)head+=`<th class="group" colspan="${n}">${fmt}</th>`}head+='</tr><tr>';
 for(const enc of ['DWG binary','DXF ASCII','DXF binary']){let n=cols.filter(x=>x.c[0]+' '+x.c[2]===enc).length;if(n)head+=`<th colspan="${n}">${enc.split(' ')[1]}</th>`}head+='</tr><tr>'+cols.map(({c})=>`<th style="writing-mode:vertical-rl;height:34px;padding:0">${c[1]}</th>`).join('')+'</tr></thead>';
 let body='',text='';
 DATA.topics.forEach((t,ti)=>{
  t={...t,features:detailFeatures(t)};
  if(detailFilter?.get("item")){const item=DATA.main_view.groups.filter(g=>!detailFilter.get("kind")||g.kind===detailFilter.get("kind")).flatMap(g=>g.rows).find(r=>r.name===detailFilter.get("item"));if(item&&!item.dataset.intents.includes(t.id))return;}
  t.features.forEach(f=>cols.forEach(({k})=>counts[state(f.cells[k])]++));
  const entries=[{name:t.title,cells:DATA.columns.map((_,k)=>aggregate(t.features,k)),topic:true},...((tableMode||expanded.has(ti))?t.features:[])];
  entries.forEach((f,fi)=>{
   const visible=cols.filter(({k})=>$('status').value==='all'||state(f.cells[k])===$('status').value);
   if(!visible.length && !(f.topic && t.features.some(ff=>cols.some(({k})=>state(ff.cells[k])===$('status').value))))return;
   let label=f.topic?topicButton(f.name,ti,t.features.length):`<span class="feature" title="${esc(f.name)}">${esc(f.name)}</span>`;
   body+=`<tr><th class="rowlabel" scope="row">${label}</th>`;text+=`<tr><th scope="row">${esc(t.title===f.name?t.title:t.title+' / '+f.name)}</th>`;
   cols.forEach(({c,k},ci)=>{let cell=f.cells[k],s=state(cell),matches=$('status').value==='all'||s===$('status').value, self=view==='compatibility'&&runs(cell).some(r=>r.self), key=`${ti},${fi},${k}`;
    const title=`${f.name} • ${c.join(' ')} • ${view==='coverage'?'dataset':$('pair').selectedOptions[0].text} • ${detailDisplay(s)}${self?' • shared engine':''}`;
    body+=`<td class="${ci&&c[0]!==cols[ci-1].c[0]?'boundary':''}">${matches?square(s,`data-cell="${key}" aria-label="${esc(title)}"`,self):''}</td>`;
    text+=`<td>${matches?`<button data-cell="${key}">${icons[s]} ${detailDisplay(s)}${self?' ◥ shared engine':''}</button>`:' - '}</td>`;
   });body+='</tr>';text+='</tr>';
  });
 });
 $('grid').innerHTML=head+'<tbody>'+body+'</tbody>';$('texttable').innerHTML=head+'<tbody>'+text+'</tbody>';
 $('summary').innerHTML=states.map(s=>`<span>${swatch(s)} <b>${counts[s]}</b> feature cells ${detailDisplay(s)}</span>`).join('');
 $('legend').innerHTML=states.map(s=>`<span>${swatch(s)} ${detailDisplay(s)}</span>`).join('');
 $('method').textContent=view==='coverage'?'Counts are feature × format/version/encoding cells, before status filtering. Measured means a file exists in a declared source folder and every declared writable pair with a source in that cell has results, whether or not those results show loss. Partly measured lists missing measurements. Missing files are planned when a source program can write them; no source means no eligible source program can write the cell. Topic squares show the worst feature status.':'Counts are feature × format/version/encoding cells, before status filtering. All pairs shows the worst measured outcome. Losses require a clean source baseline. Source not readable, writer or converter, unreadable by reader, and read failed remain separate outcomes. Not scored means the checker cannot evaluate the field. No measurement = not run. Topic squares show the worst feature status.';
 $('grid').hidden=tableMode;$('texttable').hidden=!tableMode;
}
function selection(el){let [ti,fi,k]=el.dataset.cell.split(',').map(Number),t={...DATA.topics[ti],features:detailFeatures(DATA.topics[ti])},f=fi===0?{name:t.title,cells:DATA.columns.map((_,n)=>aggregate(t.features,n))}:t.features[fi-1];return {t,f,k,c:f.cells[k]}}
function tooltip(el){let lines;if(el.dataset.evidence!==undefined){const c=viewCells[+el.dataset.evidence];lines=[c.label,...(c.intents||[]),...(c.notes||[])];}else{let {t,f,k,c}=selection(el),rs=runs(c);lines=[t.title+' / '+f.name,DATA.columns[k].join(' '),$('mode').value==='coverage'?'Dataset coverage':$('pair').selectedOptions[0].text,icons[state(c)]+' '+detailDisplay(state(c)),...(state(c)==='no source'?['no program in this dataset writes '+DATA.columns[k].join(' ')+' as a source']:[]),...(c.missing||[]),...(c.impossible||[]),...(state(c)==='blocked'?[t.description]:[]),...(rs.some(r=>r.diffs.length)?['Fields: '+[...new Set(rs.flatMap(r=>r.diffs.map(d=>d.field)))].join(', ')]:[])];}$('tooltip').textContent=lines.join('\n');$('tooltip').hidden=false;let b=el.getBoundingClientRect();$('tooltip').style.left=Math.min(b.left,innerWidth-370)+'px';$('tooltip').style.left=Math.max(8,parseFloat($('tooltip').style.left))+'px';$('tooltip').style.top=Math.max(8,Math.min(b.bottom+8,innerHeight-$('tooltip').offsetHeight-8))+'px'}
function fileLinks(path,label,unavailable=false){if(unavailable)return `<li>${esc(label)}: ${esc(path)} (unavailable; no drawing or provenance record was produced)</li>`;return `<li>${esc(label)}: <a href="../${esc(path)}">${esc(path)}</a> · <a href="../${esc(path)}.provenance.json">provenance record (how this file was made)</a></li>`}
function panel(el){lastCell=el;let {t,f,k,c}=selection(el),rs=runs(c);$('tooltip').hidden=true;$('details').innerHTML=`<h2>${esc(t.title===f.name?t.title:t.title+' / '+f.name)}</h2><p>${esc(DATA.columns[k].join(' '))} · ${icons[state(c)]} ${esc(detailDisplay(state(c)))}</p><p>${esc(t.description)}</p><p><a href="../intent/${esc(t.id)}.json">Intent and expected fields</a></p>`+($('mode').value==='coverage'?'<p>'+[...(c.missing||[]),...(c.impossible||[])].map(esc).join('<br>')+'</p><ul>'+c.files.map(p=>fileLinks(p,'Drawing')).join('')+'</ul>':rs.map(r=>`<h3>${esc(r.pair.replace('__',' → '))} · ${icons[r.status]} ${esc(display(r.status))}${r.self?' ◥ shared engine':''}</h3><p>Reader: ${esc(r.readers.join(', ')||'No reader recorded')}</p>${r.stale?'<p>Stale output: its recorded source digest predates the current input linked below.</p>':''}<ul>${r.inputs.map(p=>fileLinks(p,'Input')).join('')}${fileLinks(r.output,'Output',r.unavailable)}</ul>${r.diffs.length?r.diffs.map(d=>`<h3>${esc(d.field||'File open')} · ${esc(display(d.status))}</h3><p>${esc(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail)||'')}</p><small>Expected (intent)</small><pre>${esc(JSON.stringify(d.expected,null,2))}</pre><small>Actual (output)</small><pre>${esc(JSON.stringify(d.actual,null,2))}</pre>`).join(''):'<p>No differing fields recorded.</p>'}`).join('')||'<p>No run or files recorded for this selection.</p>');$('panel').hidden=false;$('close').focus()}
function resetStatus(){let old=$('status').value;$('status').innerHTML='<option value="all">All statuses</option>'+sets[$('mode').value].map(s=>`<option value="${s}">${detailDisplay(s)}</option>`).join('');if(sets[$('mode').value].includes(old))$('status').value=old}
for(const p of DATA.pairs)$('pair').add(new Option(p.replace('__',' → '),p));
$('builds').textContent=DATA.builds.join(' · ');
for(const id of ['view','mode','pair','format','status'])$(id).onchange=()=>{if(id==='view'){detailFilter=null;}if(id==='view'||id==='mode')resetStatus();$('tooltip').hidden=true;$('panel').hidden=true;if($('status').value!=='all')DATA.topics.forEach((t,ti)=>{
  t={...t,features:detailFeatures(t)};
  if(detailFilter?.get("item")){const item=DATA.main_view.groups.filter(g=>!detailFilter.get("kind")||g.kind===detailFilter.get("kind")).flatMap(g=>g.rows).find(r=>r.name===detailFilter.get("item"));if(item&&!item.dataset.intents.includes(t.id))return;}if(t.features.some(f=>f.cells.some(c=>state(c)===$('status').value)))expanded.add(ti)});render()};
$('tabletoggle').onclick=()=>{tableMode=!tableMode;$('tabletoggle').setAttribute('aria-pressed',tableMode);$('tabletoggle').textContent=tableMode?'Heatmap view':'Table view';render()};
document.addEventListener('click',e=>{const topic=e.target.closest('[data-topic]'),cell=e.target.closest('[data-cell]');if(topic){let n=$('view').value==='comparison'?topic.dataset.topic:+topic.dataset.topic;expanded.has(n)?expanded.delete(n):expanded.add(n);render()}if(cell)panel(cell)});
document.addEventListener('mouseover',e=>{const cell=e.target.closest('[data-cell], [data-evidence]');if(cell)tooltip(cell)});document.addEventListener('focusin',e=>{if(e.target.matches('[data-cell], [data-evidence]'))tooltip(e.target)});document.addEventListener('mouseout',e=>{if(e.target.closest('[data-cell], [data-evidence]'))$('tooltip').hidden=true});
$('close').onclick=()=>{$('panel').hidden=true;lastCell?.focus()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('panel').hidden=true;$('tooltip').hidden=true;lastCell?.focus()}});
initializeViews();resetStatus();render();
</script></html>
